name: Aggiornamento Prezzi Settimanale

on:
  schedule:
    # Esegue ogni lunedì alle 02:00 di notte
    - cron: '0 2 * * 1'
  workflow_dispatch: # Permette di avviarlo manualmente dal tab "Actions"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Esegui script aggiornamento prezzi
        run: python updater/update_prices.py

      - name: Salva e carica le modifiche (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/products.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico prezzi [skip ci]"
          git push
