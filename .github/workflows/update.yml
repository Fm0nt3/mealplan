name: Aggiornamento Offerte Lidl (Giovedi)

on:
  schedule:
    # Esegue ogni giovedì alle 03:00 del mattino
    - cron: '0 3 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Esegui script aggiornamento prezzi
        run: python updater/update_prices.py

      - name: Salva e carica le modifiche (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/products.json
          git diff --quiet && git diff --staged || git commit -m "Aggiornamento settimanale offerte Lidl del giovedi [skip ci]"
          git push
