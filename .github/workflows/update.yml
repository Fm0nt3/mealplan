name: Intelligenza Artificiale Lidl (Giovedi)

on:
  schedule:
    - cron: '0 3 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Installa librerie
        run: pip install -r updater/requirements.txt

      - name: Genera nuove ricette con AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python updater/update_prices.py

      - name: Salva e pubblica sul sito (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MealPlan AI Bot"
          git add data/recipes.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Nuove ricette generate dall'AI in base alle offerte"
          git push
